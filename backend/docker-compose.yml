services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: task_pass
      POSTGRES_DB: task_manager
    ports:
      # map host port 5433 to the container 5432 so we avoid conflicts with a host Postgres
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
